<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SYS</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="https://analytics.tongatron.org/script.js" data-website-id="a7765cdd-df40-4a78-b7bb-405e461036cf"></script>
</head>
<body>
  <div id="terminal" role="application" aria-label="Terminale SYS">
    <div id="output" aria-live="polite"></div>
    <div id="input-line">
      <span id="prompt">SYS&gt;</span>
      <input
        id="input"
        type="text"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        aria-label="Inserisci testo"
        placeholder="scrivi qui e premi invio…"
      />
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
